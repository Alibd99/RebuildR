name: Bug report
description: Report something that’s broken or incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
      placeholder: Clear and concise description…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser/runtime, versions, etc.
      placeholder: macOS 15.x, Node 20.x, …
    validations:
      required: false

